{% extends "base.html" %}{% block content %}
<div class="lab-header"><a href="/auth" class="back-link">← Back</a><h1>Level 3: Access Control</h1>
<p class="muted">You are logged in as Bob (user ID 3).</p>
<p class="muted">API: <code>GET /auth/3/api/users/&lt;id&gt;</code></p></div>
<div class="card"><h3>View User Profile</h3>
<div style="display:flex;gap:8px;margin-top:12px"><input type="number" id="uid" value="3" style="width:80px"><button class="btn btn-sm" onclick="load()">Fetch</button></div>
<div id="out" class="code-block" style="display:none;margin-top:12px"></div></div>
<details class="hint-box"><summary>Hint</summary><p>The API takes an ID number. Are you restricted to only your own?</p></details>
{% endblock %}{% block scripts %}<script>
async function load(){const r=await fetch('/auth/3/api/users/'+document.getElementById('uid').value);const d=await r.json();const e=document.getElementById('out');e.style.display='block';e.textContent=JSON.stringify(d,null,2)}</script>{% endblock %}
